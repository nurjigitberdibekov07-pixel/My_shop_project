<form id="product-form" action="" method="POST">
{% csrf_token %}

{% for error in form.non_field_errors %}
   <p class="text-danger fs-6">{{ error }}</p>
{% endfor %}
{% for field in form %}
    <p><label for="{{ form.id_for_label }}">{{ field.label }}</label></p>
        {% for error in field.errors %}
            <p class="text-danger fs-6">{{ error }}</p>
        {% endfor %}
    <p>{{ field }}</p>
{% endfor %}
</form>
